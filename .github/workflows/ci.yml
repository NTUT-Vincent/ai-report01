name: CI

on:
  pull_request:
  push:
    branches:
      - agent/okf-knowledge-factory-mvp

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: okf
          POSTGRES_USER: okf
          POSTGRES_PASSWORD: okf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U okf -d okf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://okf:okf@localhost:5432/okf
      RAW_DATA_DIR: ./data/raw
      MAX_UPLOAD_SIZE_MB: 20
      PYTHONWARNINGS: ignore
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -q -r requirements.txt pytest
      - name: Compile Python
        run: python -m py_compile app.py app_agent.py
      - name: Run backend tests
        run: pytest -q --tb=short --junitxml=test-results.xml 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend/pytest.log
            backend/test-results.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install --silent
      - name: Build frontend
        run: npm run build --silent 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: frontend/build.log
