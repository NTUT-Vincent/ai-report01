name: CI

on:
  pull_request:
  push:
    branches:
      - agent/okf-knowledge-factory-mvp

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: okf
          POSTGRES_USER: okf
          POSTGRES_PASSWORD: okf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U okf -d okf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://okf:okf@localhost:5432/okf
      RAW_DATA_DIR: ./data/raw
      MAX_UPLOAD_SIZE_MB: 20
      PYTHONWARNINGS: ignore
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -q -r requirements.txt pytest
      - name: Compile Python
        run: python -m py_compile app.py app_agent.py mock_llm.py
      - name: Run backend tests
        run: pytest -q --tb=short --junitxml=test-results.xml 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend/pytest.log
            backend/test-results.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install --silent
      - name: Build frontend
        run: npm run build --silent 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: frontend/build.log

  playwright-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: okf
          POSTGRES_USER: okf
          POSTGRES_PASSWORD: okf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U okf -d okf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://okf:okf@localhost:5432/okf
      RAW_DATA_DIR: ./backend/data/raw
      MAX_UPLOAD_SIZE_MB: 20
      PYTHONPATH: backend
      VITE_API_BASE: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install application dependencies
        run: |
          pip install -q -r backend/requirements.txt
          cd frontend
          npm install --silent
          npx playwright install --with-deps chromium
      - name: Start backend, mock model, and frontend
        run: |
          cd backend
          nohup uvicorn app_agent:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &
          nohup uvicorn mock_llm:app --host 127.0.0.1 --port 9000 > ../mock-llm.log 2>&1 &
          cd ../frontend
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../frontend-e2e.log 2>&1 &
          for url in http://localhost:8000/health http://localhost:9000/health http://localhost:5173; do
            for attempt in {1..60}; do
              if curl --fail --silent "$url" > /dev/null; then break; fi
              if [ "$attempt" -eq 60 ]; then echo "Service failed: $url"; exit 1; fi
              sleep 1
            done
          done
      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            backend-e2e.log
            mock-llm.log
            frontend-e2e.log
